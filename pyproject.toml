[project]
name = "panorama-reception"
version = "0.1.0"
description = "Réceptionniste téléphonique de l'Hôtel Panorama — v1 SIP"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pjsua2-python==2.15.1.post1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tts = ["gTTS>=2.5"]

[project.scripts]
reception = "reception.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reception*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
